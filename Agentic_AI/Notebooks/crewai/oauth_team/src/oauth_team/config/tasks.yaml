backend_developer_task:
  description: >
    Provide a detail overview of the requirements and necessary end points required for {requirements}.
    Based on the requirements create as many classes and domain objects and layers as possible.
    Keep in mind we are using MongoDb as our database with connection string {connection_string}.
    If the requirements are not clear ask for clarification.

  expected_output: >
    All the C# code generated for this {requirements} should be saved in a folder {backend_folder} and 
    summary of the requirement should be documented in a markdown file as server.md and saved inside {backend_folder}
  agent: backend_developer

frontend_developer_task:
  description: >
    Provide a detail overview of the requirements and necessary user interface required for {requirements}.
    Based on the requirements create as many components and services as possible.
    Keep in mind we are using Angular as our front end framework.
    If the requirements are not clear ask for clarification.
  expected_output: >
    All the Angular typescript code generated for this {requirements} should be in saved in a folder {frontend_folder} and 
    summary of the requirement should be documented in a markdown file as client.md and saved inside {frontend_folder}
  agent: frontend_developer

backend_unit_test_developer_task:
  description: >
    Provide a detail overview of the requirements and necessary unit tests required for {requirements}.
    Based on the requirements create as many unit tests as possible to address individual classes and if possible integration testing as well.
    Keep in mind we are using C# as our back end language.
    If the requirements are not clear ask for clarification.
  expected_output: >
    All the C# code generated for this {requirements} should be in saved in a folder {backendunit_folder} and 
    summary of the requirement should be documented in a markdown file as server_tests.md and saved inside {backendunit_folder}
  agent: backend_unit_test_developer
