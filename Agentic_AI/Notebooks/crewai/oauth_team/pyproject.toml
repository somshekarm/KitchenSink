[project]
name = "oauth_team"
version = "0.1.0"
description = "oauth_team using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.121.1,<1.0.0"
]

[project.scripts]
oauth_team = "oauth_team.main:run"
run_crew = "oauth_team.main:run"
train = "oauth_team.main:train"
replay = "oauth_team.main:replay"
test = "oauth_team.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
